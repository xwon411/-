<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>농생대 분실물 보관함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 물품 대여 현황(public.html)과 같은 토큰·구조. 600px 단일 열, 흰 카드 목록 */
:root{
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --bg:#f6f5f2;--surface:#fff;--surface2:#f6f5f2;--border:#e6e4de;
  --accent:#2d5016;--accent-pale:#e8f0e0;
  --text:#1b1d1a;--text-muted:#6b6f68;
  --ok:#16a34a;--few:#c2410c;--none:#dc2626;--renting:#2563eb;
  --track:#ecebe6;--hover:#fafaf8;--divider:#f0efe9;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-feature-settings:'tnum';letter-spacing:-.005em;font-size:14px}
button,input{font-family:var(--font)}
.ic{display:block;flex-shrink:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 헤더 */
header{background:var(--surface);border-bottom:1px solid var(--border)}
.hd-in{max-width:960px;margin:0 auto;padding-block:22px 16px}
.hd-tag{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.hd-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hd-sub{font-size:13px;color:var(--text-muted);margin-top:2px}

/* 업데이트 줄 */
.update-bar{max-width:960px;margin:0 auto;width:100%;padding-block:12px 0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.upd-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.upd-dot.sample{background:#d4a017}
.upd-label{white-space:nowrap}
.upd-time{color:var(--text);font-weight:500}
.upd-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.upd-btn:hover{background:var(--hover)}

/* 메인 */
main{flex:1;padding-block:12px 40px;max-width:960px;margin:0 auto;width:100%}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.sec-title{font-size:13px;font-weight:600;color:var(--text-muted)}
.sec-title b{color:var(--accent);margin-left:4px}
.sec-asof{font-size:12px;color:var(--text-muted);white-space:nowrap}

/* 물품 찾기 */
.search-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.search-title{font-size:15px;font-weight:700;margin-bottom:3px}
.search-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;line-height:1.55}
.search-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none;background:var(--surface2);-webkit-appearance:none;transition:border-color .12s;color:var(--text)}
.search-input:focus{border-color:var(--accent);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-weight:500;opacity:.7}
.chip:focus-visible,.upd-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 분실물 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:44px;height:44px}
.thumb .lock-txt{font-size:12px;font-weight:600}
.tag-no{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);padding:2px 7px;border-radius:6px}
.photo-note{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;color:#fff;background:rgba(27,29,26,.55);padding:2px 7px;border-radius:5px}
.ic-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ic-name{font-size:15px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.meta dt{color:var(--text-muted)}
.meta dd{min-width:0;overflow-wrap:anywhere}
.ic-badge{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.ic-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ic-badge.avail{color:var(--ok)}.ic-badge.few{color:var(--few)}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ic-body{padding:10px 11px 12px}.meta{grid-template-columns:1fr;gap:0}.meta dt{font-size:11px}}

.empty{text-align:center;padding:18px 0 8px;color:var(--text-muted);font-size:13px}

/* 안내 */
.notice{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:18px;font-size:13px;line-height:1.75;color:var(--text-muted)}
.notice b{color:var(--text);font-weight:600}
.notice-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px}

footer{text-align:center;padding-block:16px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border)}

/* 물품 아이콘 색 (물품대여 페이지와 같은 팔레트) */
.ibs-umbrella{background:#e6f4f1;color:#0f766e}.ibs-charger{background:#fbf3e0;color:#a16207}.ibs-calculator{background:#eef1f5;color:#475569}.ibs-multitap{background:#eef5e4;color:#4d7c0f}.ibs-heatpack{background:#fdeee6;color:#c2410c}

@media(max-width:380px){
  .hd-title{font-size:19px}
  .search-section,.notice{padding:14px}
}
</style>
</head>

  <div class="hd-tag">SNU CALS</div>

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell.replace(/\r$/, "")); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const toItem = ([no, date, place, name, cat, feat, photo]) => ({ no, date, place, name, cat: ICONS[cat] ? cat : "기타", feat, photo: photo || "" });

function photoSrc(link) {
  if (link.startsWith("sample:")) {
    const s = SAMPLE_PHOTOS[link.slice(7)];
    return s ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s) : "";
  }
  const m = link.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);
  if (m && link.includes("drive.google")) return "https://drive.google.com/thumbnail?id=" + (m[1] || m[2]) + "&sz=w800";
  return /^https?:\/\//.test(link) ? link : "";
}

function deadline(it) {
  if (!KEEP_DAYS) return null;
  const d = new Date(it.date + "T00:00:00");
  if (isNaN(d)) return null;
  d.setDate(d.getDate() + KEEP_DAYS);
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return { date: d, left: Math.round((d - now) / 86400000) };
}

function shortDate(s) { const n = String(s).match(/\d+/g); return n && n.length >= 3 ? `${+n[1]}.${+n[2]}` : s; }

function cardHTML(it) {
  const locked = isValuable(it);
  const [cls, icon] = ICONS[it.cat];
  const src = it.photo === "비공개" ? "" : photoSrc(it.photo);
  const dl = deadline(it);
  let dtxt = "", warn = false;
  if (dl) {
    dtxt = dl.left > 0 ? ` · D-${dl.left}` : dl.left === 0 ? " · D-day" : " · 기한 지남";
    warn = dl.left <= 3;
  }
  const badge = `<div class="ic-badge ${warn ? "few" : "avail"}">보관 중${dtxt}</div>`;
  const thumb = src
    ? `<img src="${esc(src)}" alt="${esc(it.name)}" loading="lazy">${it.photo.startsWith("sample:") ? '<span class="photo-note">예시 사진</span>' : ""}`
    : `${svg(icon)}`;
  return `<div class="item-card">
    <div class="thumb ${src ? "" : cls}">${thumb}<span class="tag-no">${esc(it.no)}</span></div>
    <div class="ic-body">
      <div class="ic-name">${esc(it.name)}</div>
      <dl class="meta">
        <dt>습득일</dt><dd>${esc(shortDate(it.date))}</dd>
        <dt>습득장소</dt><dd>${esc(it.place)}</dd>
        <dt>특징</dt><dd>${esc(it.feat || "-")}</dd>
      </dl>
      ${badge}
    </div>
  </div>`;
}

function render() {
  const cats = ["전체", ...Object.keys(ICONS).filter((c) => c === "기타" || state.items.some((i) => i.cat === c))];
  if (!cats.includes(state.cat)) state.cat = "전체";
  $("chips").innerHTML = cats.map((c) => {
    const n = c === "전체" ? state.items.length : state.items.filter((i) => i.cat === c).length;
    return `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === state.cat}">${esc(c)}<span class="n">${n}</span></button>`;
  }).join("");
  const list = state.items.filter((i) => state.cat === "전체" || i.cat === state.cat);
  $("list").innerHTML = list.map(cardHTML).join("");
  $("empty").hidden = list.length > 0;
  $("sec-count").textContent = state.items.length;
  const t = new Date();
  $("sec-asof").textContent = `${t.getFullYear()}.${pad(t.getMonth() + 1)}.${pad(t.getDate())} 기준`;
}

function stamp(sample) {
  const t = new Date();
  $("upd-time").textContent = `${t.getFullYear()}.${pad(t.getMonth() + 1)}.${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  $("upd-dot").className = "upd-dot" + (sample ? " sample" : "");
  $("upd-label").textContent = sample ? "시안 · 예시 데이터" : "업데이트";
}

async function loadData() {
  if (SHEET_CSV_URL) {
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const rows = parseCSV(await res.text());
      const h = rows.findIndex((r) => r[0] === "접수번호");
      state.items = rows.slice(h + 1).filter((r) => /^L-/.test(r[0] || "")).map(toItem);
      render(); stamp(false); return;
    } catch (e) {
      state.items = []; render(); stamp(false);
      $("upd-label").textContent = "불러오기 실패 · 새로고침해 주세요";
      return;
    }
  }
  state.items = SAMPLE.map(toItem);
  render(); stamp(true);
}

$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.cat = b.dataset.cat; render();
});
$("upd-btn").addEventListener("click", loadData);
loadData();
</script>
