<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="대여 현황">
<meta property="og:type" content="website">
<meta property="og:title" content="농생대 학생회 물품 대여 현황">
<meta property="og:description" content="농생대 학생회 물품 실시간 대여 가능 현황 · 내 대여 조회">
<meta property="og:image" content="https://xwon411.github.io/-/icon-512.png">
<meta property="og:url" content="https://xwon411.github.io/-/public.html">
<link rel="manifest" href="manifest-public.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>농생대 학생회 물품 대여 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --bg:#f6f5f2;--surface:#fff;--surface2:#f6f5f2;--border:#e6e4de;
  --accent:#2d5016;--accent-pale:#e8f0e0;
  --text:#1b1d1a;--text-muted:#6b6f68;
  --ok:#16a34a;--few:#c2410c;--none:#dc2626;--renting:#2563eb;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-feature-settings:'tnum';letter-spacing:-.005em}
button,input{font-family:var(--font)}
.ic{display:block;flex-shrink:0}

/* 헤더 */
header{background:var(--surface);border-bottom:1px solid var(--border)}
.hd-in{max-width:600px;margin:0 auto;padding:22px 16px 16px}
.hd-tag{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.hd-title{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hd-sub{font-size:13px;color:var(--text-muted);margin-top:2px}

/* 업데이트 줄 */
.update-bar{max-width:600px;margin:0 auto;width:100%;padding:12px 16px 0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted)}
.upd-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.upd-dot.loading{background:#d4a017}
.upd-label{white-space:nowrap}
.upd-time{color:var(--text);font-weight:500}
.upd-btn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.upd-btn:hover{background:#fafaf8}
.upd-btn:disabled{opacity:.5;cursor:default}

/* 메인 */
main{flex:1;padding:12px 16px 40px;max-width:600px;margin:0 auto;width:100%}
.sec-title{font-size:13px;font-weight:600;color:var(--text-muted);margin:18px 2px 8px}

/* 물품 카드 */
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:8px}
.ic-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ic-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-info{flex:1;min-width:0}
.ic-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ic-total{font-size:12px;color:var(--text-muted);margin-top:2px}
.ic-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.ic-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ic-badge.avail{color:var(--ok)}.ic-badge.few{color:var(--few)}.ic-badge.none{color:var(--none)}
.ic-bar-wrap{display:flex;align-items:center;gap:10px}
.ic-bar-track{flex:1;height:6px;background:#ecebe6;border-radius:3px;overflow:hidden}
.ic-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.ic-bar-nums{font-size:12px;font-weight:600;white-space:nowrap;min-width:44px;text-align:right;color:var(--text-muted)}

/* 안내 */
.notice{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:18px;font-size:13px;line-height:1.75;color:var(--text-muted)}
.notice b{color:var(--text);font-weight:600}
.notice-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px}

/* 로딩 */
.skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:skel 1.4s ease infinite;border-radius:6px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

footer{text-align:center;padding:16px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border)}

/* 내 대여 조회 */
.search-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.search-title{font-size:15px;font-weight:700;margin-bottom:3px}
.search-sub{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;line-height:1.55}
.search-row{display:flex;flex-direction:column;gap:8px}
.search-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none;background:var(--surface2);-webkit-appearance:none;transition:border-color .12s}
.search-input:focus{border-color:var(--accent);background:#fff}
.search-phone-row{display:flex;gap:8px;align-items:stretch}
.search-phone-row .search-input{flex:1;min-width:0}
.search-btn{padding:11px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.search-btn:hover{filter:brightness(1.12)}

/* 조회 결과 */
.result-wrap{margin-top:12px}
.result-empty{text-align:center;padding:18px 0 8px;color:var(--text-muted);font-size:13px}
.rental-result-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;background:var(--surface)}
.rrc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rrc-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rrc-name{font-size:14px;font-weight:700}
.rrc-num{font-size:12px;color:var(--text-muted)}
.rrc-status{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.rrc-status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.rrc-st-renting{color:var(--renting)}.rrc-st-unpaid{color:var(--none)}.rrc-st-returned{color:var(--ok)}
.rrc-dday{border-top:1px solid #f0efe9;padding-top:10px;font-size:13px}
.rrc-dday .dd-big{font-size:16px;font-weight:700}
.rrc-dday.ok .dd-big{color:var(--text)}.rrc-dday.warn .dd-big{color:var(--few)}.rrc-dday.over .dd-big{color:var(--none)}
.rrc-dday.done{color:var(--text-muted)}
.rrc-dday .dd-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.rrc-date{font-size:12px;color:var(--text-muted);margin-top:6px}

/* 물품 아이콘 색 (관리자 페이지와 동일) */
.ibs-umbrella{background:#e6f4f1;color:#0f766e}.ibs-charger{background:#fbf3e0;color:#a16207}.ibs-calculator{background:#eef1f5;color:#475569}.ibs-multitap{background:#eef5e4;color:#4d7c0f}.ibs-heatpack{background:#fdeee6;color:#c2410c}

@media(max-width:380px){
  .hd-title{font-size:19px}
  main{padding:10px 12px 36px}
  .item-card,.search-section,.notice{padding:14px}
  .search-btn{padding:11px 14px;font-size:13px}
}
</style>
</head>
<body>

<header><div class="hd-in">
  <div class="hd-tag">SNU CALS</div>
  <div class="hd-title">물품 대여 현황</div>
  <div class="hd-sub">농업생명과학대학 학생회</div>
</div></header>

<div class="update-bar">
  <div class="upd-dot loading" id="upd-dot"></div>
  <span class="upd-label">업데이트</span>
  <span class="upd-time" id="upd-time">불러오는 중...</span>
  <button class="upd-btn" id="upd-btn" onclick="loadData()"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>새로고침</button>
</div>

<main>
  <!-- 내 대여 검색 -->
  <div class="search-section">
    <div class="search-title">내 대여 조회</div>
    <div class="search-sub">이름과 전화번호로 내 대여 기록과 반납 기한을 확인할 수 있어요</div>
    <div class="search-row">
      <input class="search-input" type="text" id="name-input" placeholder="이름 (예: 홍길동)"
        onkeydown="if(event.key==='Enter')searchMyRental()">
      <div class="search-phone-row">
        <input class="search-input" type="tel" id="phone-input" placeholder="전화번호 (010-1234-5678)"
          oninput="fmtPhone(this)" onkeydown="if(event.key==='Enter')searchMyRental()">
        <button class="search-btn" onclick="searchMyRental()">조회</button>
      </div>
    </div>
    <div class="result-wrap" id="search-result" style="display:none"></div>
  </div>

  <div class="sec-title">지금 빌릴 수 있는 물품</div>
  <div id="cards">
    <!-- 스켈레톤 -->
    <div class="item-card" style="opacity:.5">
      <div class="ic-head">
        <div style="width:28px;height:28px;border-radius:50%" class="skeleton"></div>
        <div style="flex:1">
          <div style="width:100px;height:16px;margin-bottom:6px" class="skeleton"></div>
          <div style="width:60px;height:11px" class="skeleton"></div>
        </div>
        <div style="width:80px;height:30px;border-radius:30px" class="skeleton"></div>
      </div>
      <div style="height:10px;border-radius:20px" class="skeleton"></div>
    </div>
  </div>

  <div class="notice" id="notice">
    <div class="notice-title">대여 안내</div>
    <div id="notice-body"></div>
  </div>
</main>

<footer>농업생명과학대학 학생회 · 대여 현황은 실시간으로 갱신됩니다</footer>

<script>
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// ── Firebase (읽기 전용) ──────────────────────────────────────
const FB = 'https://cals-rental-default-rtdb.firebaseio.com';

const DEFAULT_ITEM_NUMBERS = {
  umbrella:[5,7,9,10,11,16,17,20,21,24,35,38,40,44,48,53,59,65,68,76,
    'A-1','A-2','A-3','A-4','A-5','A-6','A-7','A-8','A-9','A-10',
    'A-11','A-12','A-13','A-14','A-15','A-16','A-17','A-18','A-19','A-20',
    'A-21','A-22','A-23','A-24','A-25','A-26','A-27','A-28','A-29','A-30',
    'A-31','A-32','A-33','A-34','A-35','A-36','A-37','A-38','A-39','A-40',
    'A-41','A-42','A-43','A-44','A-45','A-46','A-47','A-48','A-49','A-50'],
  charger:['1-1-1','1-1-2','1-1-3','1-2-1','1-2-2','1-2-3','1-2-4','1-3-1','1-3-2','1-3-3','1-3-4','1-4-1','1-4-2'],
  calculator:['2-1','2-2','2-3'], multitap:['3-1','3-2','3-3','3-4','3-5'], heatpack:['4-1','4-2','4-3','4-4','4-5']
};

let ITEM_NUMBERS = JSON.parse(JSON.stringify(DEFAULT_ITEM_NUMBERS));
let rentals = [];
let itemStatus = {};

function fbKey(type, num){ return `${type}_${String(num).replace(/[\.\#\$\/\[\]]/g,'_')}`; }

// 데이터가 비어 있으면 null, 네트워크/서버 오류면 throw (실패를 '기록 없음'으로 보여주지 않도록)
async function fbGet(path){
  const r = await fetch(`${FB}${path}.json`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return d || null;
}
let loaded = false; // 한 번이라도 정상적으로 불러왔는지

// ── 대여 안내 (관리자 페이지 '📢 학생 페이지 안내'에서 수정 → Firebase /publicInfo) ──
const PUBLIC_INFO_DEFAULT = {
  location:'200동 1037A호 (학생회실)',
  hours:'평일 14:00 ~ 18:00',
  periods:'약속우산 : 대여 후 일주일 이내 반납\n충전기 · 계산기 · 멀티탭 · 찜질팩 : 당일 18:00까지 반납',
  contact:'복지부국장 김서준 (010-9643-4064)'
};
function renderNotice(info){
  const d = {...PUBLIC_INFO_DEFAULT, ...(info||{})};
  const rows = [];
  if(d.location) rows.push(`<b>대여 위치</b> : ${esc(d.location)}`);
  if(d.hours)    rows.push(`<b>대여 시간</b> : ${esc(d.hours)}`);
  const periods = String(d.periods||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(periods.length) rows.push(`<b>대여 기간</b>` + periods.map(x=>`<br>&nbsp;&nbsp;· ${esc(x)}`).join(''));
  if(d.contact)  rows.push(`<b>문의</b> : ${esc(d.contact)}`);
  document.getElementById('notice-body').innerHTML = rows.join('<br>');
}
// 불러오기 전에는 회색 로딩 표시만 (기본 문구가 잠깐 보였다 바뀌는 깜빡임 방지)
document.getElementById('notice-body').innerHTML =
  '<div class="skeleton" style="height:12px;width:70%;margin:6px 0"></div>'+
  '<div class="skeleton" style="height:12px;width:55%;margin:6px 0"></div>'+
  '<div class="skeleton" style="height:12px;width:80%;margin:6px 0"></div>';
let noticeShown = false;

// 관리자 페이지(index.html)의 getItemState와 같은 규칙
function getItemState(type, num){
  const key = fbKey(type, num);
  const iSt = itemStatus[key];
  const iStVal=typeof iSt==='object'?iSt.v:iSt;
  if(iStVal==='broken') return 'broken';
  const recs = rentals
    .filter(r => r.item === type && String(r.itemNum) === String(num))
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  const last = recs[0];
  if(!last) return iStVal==='lost' ? 'lost' : 'available';
  if(last.status === 'unpaid_paid') return 'renting';               // 연체료 납부 후 아직 반납 전 → 대여중
  if(last.status === 'lost_paid' && !last.replacedAt) return 'lost'; // 분실비 납부, 아직 교체 전
  if(last.status === 'lost_paid') return iStVal==='lost' ? 'lost' : 'available'; // 새 물품으로 교체됨
  if(iStVal==='lost') return 'lost';
  if(last.status === 'returned') return 'available';
  return last.status;
}

// ── 렌더 ────────────────────────────────────────────────────
function render(){
  const types = Object.keys(ITEM_NUMBERS);
  const wrap = document.getElementById('cards');
  wrap.innerHTML = types.map(t => {
    const nums    = ITEM_NUMBERS[t];
    const states  = nums.map(n => getItemState(t, n));
    const avail   = states.filter(s => s === 'available').length;
    const renting = states.filter(s => s === 'renting').length;
    // 미납·고장·분실은 제외한 실질 운용 가능 수량
    const effective = avail + renting;
    const pct   = effective > 0 ? Math.round(avail / effective * 100) : 0;

    // 배지
    let badgeCls, badgeTxt;
    if(avail === 0)     { badgeCls='none';  badgeTxt='대여 불가'; }
    else if(pct <= 30)  { badgeCls='few';   badgeTxt=`${avail}개 가능`; }
    else                { badgeCls='avail'; badgeTxt=`${avail}개 가능`; }
    const color = {none:'var(--none)',few:'var(--few)',avail:'var(--ok)'}[badgeCls];

    return `<div class="item-card">
      <div class="ic-head">
        <div class="ic-icon ibs-${t}">${itemIcon(t,18)}</div>
        <div class="ic-info">
          <div class="ic-name">${ITEM_LABELS[t]}</div>
          <div class="ic-total">전체 ${effective}개${renting?` · 대여중 ${renting}개`:''}</div>
        </div>
        <div class="ic-badge ${badgeCls}">${badgeTxt}</div>
      </div>
      <div class="ic-bar-wrap">
        <div class="ic-bar-track">
          <div class="ic-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="ic-bar-nums">${avail} / ${effective}</div>
      </div>
    </div>`;
  }).join('');
}

// ── 내 대여 조회 ─────────────────────────────────────────────
const ITEM_LABELS = {umbrella:'약속우산', charger:'충전기', calculator:'공학용 계산기', multitap:'멀티탭', heatpack:'찜질팩'};
const ITEM_ICO_PATHS = {
  umbrella:'<path d="M22 12a10 10 0 0 0-20 0Z"/><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/>',
  charger:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  calculator:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/>',
  multitap:'<rect x="2" y="8" width="20" height="8" rx="2"/><circle cx="7" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="17" cy="12" r="1.2"/>',
  heatpack:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'
};
const itemIcon = (t,sz) => ITEM_ICO_PATHS[t] ? `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ITEM_ICO_PATHS[t]}</svg>` : '';


function getDueInfo(r) {
  // 물품을 아직 갖고 있는 상태만 기한 표시 (반납·고장·분실·분실비 납부는 제외)
  if (!['renting','unpaid','unpaid_paid'].includes(r.status)) return null;

  const rentedAt = new Date(r.date);
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');

  let dueDate;
  if (r.item === 'umbrella') {
    // 약속우산: 대여 7일째 오후 6시 (관리자 페이지 자동 미납 기준과 동일)
    dueDate = new Date(rentedAt);
    dueDate.setDate(dueDate.getDate() + 7);
    dueDate.setHours(18, 0, 0, 0);
  } else {
    // 생필품: 대여 당일 18:00
    dueDate = new Date(rentedAt);
    dueDate.setHours(18, 0, 0, 0);
    if(dueDate <= rentedAt) dueDate.setDate(dueDate.getDate() + 1);
  }

  const diffMs  = dueDate - now;
  const diffDay = Math.floor(diffMs / 86400000);
  const diffHr  = Math.floor((diffMs % 86400000) / 3600000);
  const diffMin = Math.floor((diffMs % 3600000) / 60000);

  const dueStr = `${dueDate.getFullYear()}.${pad(dueDate.getMonth()+1)}.${pad(dueDate.getDate())} ${pad(dueDate.getHours())}:${pad(dueDate.getMinutes())}`;

  if (diffMs < 0) {
    // 기한 초과
    const absDiffMs=Math.abs(diffMs);
    const overDay=Math.floor(absDiffMs/86400000);
    const overHr=Math.floor((absDiffMs%86400000)/3600000);
    const overMin=Math.floor((absDiffMs%3600000)/60000);
    return { cls:'over', big: overDay > 0 ? `${overDay}일 ${overHr}시간 초과` : `${overHr}시간 ${overMin}분 초과`, sub:`반납 기한: ${dueStr}`, dueStr };
  } else if (diffDay === 0 && diffHr < 3) {
    return { cls:'warn', big: `${diffHr}시간 ${diffMin}분 남음`, sub:`반납 기한: ${dueStr}`, dueStr };
  } else if (diffDay < 2) {
    return { cls:'warn', big: diffDay > 0 ? `${diffDay}일 ${diffHr}시간 남음` : `${diffHr}시간 ${diffMin}분 남음`, sub:`반납 기한: ${dueStr}`, dueStr };
  } else {
    return { cls:'ok', big: `${diffDay}일 ${diffHr}시간 남음`, sub:`반납 기한: ${dueStr}`, dueStr };
  }
}

function fmtPhone(el){
  let v = el.value.replace(/\D/g,'');
  if(v.length <= 3) el.value = v;
  else if(v.length <= 7) el.value = v.slice(0,3)+'-'+v.slice(3);
  else el.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
}

function searchMyRental() {
  const name  = document.getElementById('name-input').value.trim();
  const phone = document.getElementById('phone-input').value.trim();
  const resultWrap = document.getElementById('search-result');

  if (!name || !phone) {
    resultWrap.style.display = 'block';
    resultWrap.innerHTML = `<div class="result-empty">
      <div>이름과 전화번호를 모두 입력해주세요</div>
    </div>`;
    return;
  }

  if (!loaded) {
    resultWrap.style.display = 'block';
    resultWrap.innerHTML = `<div class="result-empty">
      <div>데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요</div>
    </div>`;
    return;
  }

  // 이름 + 전화번호 모두 일치하는 기록만 (최신순)
  const found = [...rentals]
    .filter(r => r.name === name && String(r.phone||'').replace(/\D/g,'') === phone.replace(/\D/g,''))
    .sort((a,b) => new Date(b.date) - new Date(a.date));

  resultWrap.style.display = 'block';

  if (!found.length) {
    resultWrap.innerHTML = `<div class="result-empty">
      <div><b>${esc(name)}</b>님의 대여 기록이 없습니다</div>
    </div>`;
    return;
  }

  const pad = n => String(n).padStart(2,'0');
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  resultWrap.innerHTML = found.map(r => {
    const stMap = { renting:'renting', unpaid:'unpaid', returned:'returned', broken:'unpaid', lost:'unpaid', unpaid_paid:'renting', lost_paid:'returned' };
    const stLbl = { renting:'대여중', unpaid:'미납', returned:'반납완료', broken:'고장', lost:'분실', unpaid_paid:'미납 (연체료 납부)', lost_paid:'분실 (분실비 납부)' };
    const stCls = stMap[r.status] || 'renting';
    const due   = getDueInfo(r);

    let ddHtml = '';
    if (r.status === 'returned') {
      ddHtml = `<div class="rrc-dday done">반납 완료</div>`;
    } else if (r.status === 'lost_paid') {
      ddHtml = `<div class="rrc-dday done">분실비 납부 완료</div>`;
    } else if (due) {
      ddHtml = `<div class="rrc-dday ${due.cls}">
        <div class="dd-big">${due.big}</div>
        <div class="dd-sub">${due.sub}</div>
      </div>`;
    }

    return `<div class="rental-result-card">
      <div class="rrc-head">
        <div class="rrc-icon ibs-${r.item}">${itemIcon(r.item,15)}</div>
        <div>
          <div class="rrc-name">${ITEM_LABELS[r.item] || r.item}</div>
          <div class="rrc-num">번호 ${esc(r.itemNum)}</div>
        </div>
        <div class="rrc-status rrc-st-${stCls}">${stLbl[r.status] || r.status}</div>
      </div>
      ${ddHtml}
      <div class="rrc-date">대여 ${fmtDate(r.date)}</div>
    </div>`;
  }).join('');
}

// ── 로드 ─────────────────────────────────────────────────────
async function loadData(){
  const dot = document.getElementById('upd-dot');
  const timeEl = document.getElementById('upd-time');
  const btn = document.getElementById('upd-btn');

  dot.className = 'upd-dot loading';
  timeEl.textContent = '불러오는 중...';
  btn.disabled = true;

  try{
    const [rData, iData, nData] = await Promise.all([
      fbGet('/rentals'), fbGet('/itemStatus'), fbGet('/itemNumbers')
    ]);
    // 안내 문구는 실패해도 현황 표시에 영향 없게 따로 불러옴
    // 저장한 적 없거나(null) 실패하면 기본 문구 — 단, 이미 저장된 문구를 보여준 뒤 실패하면 그대로 둠
    fbGet('/publicInfo').then(d=>{renderNotice(d);noticeShown=true;})
      .catch(()=>{if(!noticeShown){renderNotice(null);noticeShown=true;}});

    rentals    = rData ? Object.values(rData) : [];
    itemStatus = iData || {};
    if(nData){
      Object.keys(ITEM_NUMBERS).forEach(t => {
        if(nData[t]) ITEM_NUMBERS[t] = nData[t];
      });
    }

    render();
    loaded = true;
    // 조회 결과를 띄워둔 상태면 최신 데이터로 다시 표시 (남은 시간·반납 여부 갱신)
    if (document.getElementById('search-result').style.display === 'block'
        && document.getElementById('name-input').value.trim()
        && document.getElementById('phone-input').value.trim()) searchMyRental();

    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    timeEl.textContent =
      `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} `+
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    dot.className = 'upd-dot';
  } catch(e){
    if(!noticeShown){renderNotice(null);noticeShown=true;}
    timeEl.textContent = '불러오기 실패';
    dot.className = 'upd-dot loading';
  } finally{
    btn.disabled = false;
  }
}

// 초기 로드 + 30초마다 자동 갱신
loadData();
setInterval(loadData, 30000);
</script>
